<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%" fill="none">
  <!-- Background Card / Room Environment -->
  <rect x="20" y="20" width="480" height="360" rx="20" fill="#EDF2EE" stroke="#D5DED6" stroke-width="2"/>
  
  <!-- Window with Daylight (representing natural light usage) -->
  <rect x="60" y="60" width="100" height="130" rx="10" fill="#FFFFFF" stroke="#1B4D3E" stroke-width="3"/>
  <line x1="110" y1="60" x2="110" y2="190" stroke="#1B4D3E" stroke-width="2"/>
  <line x1="60" y1="125" x2="160" y2="125" stroke="#1B4D3E" stroke-width="2"/>
  <!-- Sunbeams coming through window -->
  <path d="M75 75L145 175" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M125 75L150 110" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="135" cy="85" r="14" fill="#F59E0B" opacity="0.3"/>

  <!-- Plant pot on windowsill (nature element) -->
  <path d="M95 180h30l-4 15h-22z" fill="#D97706"/>
  <path d="M110 180c-8-12-2-20 4-20 6 0 10 10 4 20z" fill="#2D6A4F"/>
  <path d="M110 175c4-8 12-10 14-4 2 6-4 12-14 12z" fill="#40916C"/>

  <!-- Modern School Classroom / Lab Desk -->
  <rect x="200" y="190" width="260" height="15" rx="4" fill="#1B4D3E"/>
  <rect x="230" y="205" width="12" height="115" rx="2" fill="#2D6A4F"/>
  <rect x="420" y="205" width="12" height="115" rx="2" fill="#2D6A4F"/>

  <!-- Computer Screen (Smart Efficient Lab PC) -->
  <rect x="260" y="105" width="140" height="85" rx="8" fill="#1E293B" stroke="#1B4D3E" stroke-width="3"/>
  <rect x="270" y="115" width="120" height="65" rx="4" fill="#FFFFFF"/>
  <!-- Screen Content: Energy Saving Mode active -->
  <rect x="280" y="125" width="40" height="6" rx="3" fill="#1B4D3E"/>
  <rect x="280" y="136" width="70" height="4" rx="2" fill="#94A3B8"/>
  <rect x="280" y="145" width="55" height="4" rx="2" fill="#94A3B8"/>
  <!-- Leaf icon on monitor -->
  <circle cx="365" cy="148" r="14" fill="#EDF2EE"/>
  <path d="M360 154c0-6 4-9 10-10-1 6-4 10-10 10z" fill="#2D6A4F"/>
  <!-- Monitor Stand -->
  <rect x="322" y="190" width="16" height="15" fill="#64748B"/>
  <rect x="305" y="202" width="50" height="5" rx="2" fill="#475569"/>

  <!-- Hanging Efficient LED Lamp from ceiling -->
  <line x1="330" y1="20" x2="330" y2="55" stroke="#64748B" stroke-width="2"/>
  <path d="M310 55h40l-5 18h-30z" fill="#1B4D3E"/>
  <!-- Lightbulb with amber eco-glow -->
  <circle cx="330" cy="78" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <path d="M325 88h10" stroke="#F59E0B" stroke-width="2"/>

  <!-- Eco Wall Switch on the left wall -->
  <rect x="60" y="230" width="45" height="65" rx="8" fill="#FFFFFF" stroke="#D5DED6" stroke-width="2"/>
  <rect x="74" y="245" width="17" height="24" rx="4" fill="#1B4D3E"/>
  <!-- Little green active indicator LED -->
  <circle cx="82" cy="278" r="3" fill="#16A34A"/>

  <!-- Energy Wave / Saving Badge at bottom right -->
  <g transform="translate(320, 260)">
    <rect x="0" y="0" width="150" height="48" rx="10" fill="#FFFFFF" stroke="#2D6A4F" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="14" fill="#FEF3C7"/>
    <path d="M24 16v16M19 24h10" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1B4D3E">Eco-Smart Action</text>
    <text x="48" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#4B6354">Listrik Bijak Sekolah</text>
  </g>
</svg>
